# Tests on every push and pull request: three operating systems, three Python versions.
# Sources: GitHub Docs, "Building and testing Python" (version matrix, pytest step) and
# "Workflow syntax" (strategy.matrix with os, fail-fast).
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # a failure on one machine doesn't stop the others, so every problem shows
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check this Python's SQLite has full-text search (FTS5)
        run: python -c "import sqlite3; sqlite3.connect(':memory:').execute('CREATE VIRTUAL TABLE t USING fts5(x)'); print('FTS5 ok', sqlite3.sqlite_version)"
      - name: Install the package and test tools
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"  # the embeddings tests use a fake model, so fastembed is not needed
      - name: Test with pytest
        run: pytest -q
